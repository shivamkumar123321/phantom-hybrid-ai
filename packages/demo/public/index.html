<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PHANTOM Demo Website</title>
  <style>
    body { margin: 0 auto; max-width: 760px; padding: 24px; font: 16px/1.5 system-ui, sans-serif; }
    .card { border: 1px solid #b5bcc7; border-radius: 10px; padding: 18px; margin: 16px 0; }
    button { margin-right: 8px; padding: 8px 12px; }
    a { color: #1457b0; }
    #destination { padding: 12px; background: #e8f6e8; }
    #destination:not(:target) { display: none; }
    #log { white-space: pre-wrap; background: #f3f4f6; padding: 12px; min-height: 56px; }
  </style>
</head>
<body>
  <h1>PHANTOM Demo Website</h1>
  <p>A controlled broken navigation scenario. Enable PHANTOM monitoring for this site, then click the broken link.</p>
  <section class="card">
    <h2>Navigation</h2>
    <a id="demo-link" href="#" data-href="#destination">View the destination</a>
    <p id="state">Before: the link is broken.</p>
    <div id="destination" tabindex="-1">Destination reached.</div>
  </section>
  <section class="card">
    <h2>Developer controls</h2>
    <button id="activate" type="button">Activate bug</button>
    <button id="reset" type="button">Reset to working</button>
    <p>Link state: <strong id="link-state">broken</strong></p>
    <h3>Event log</h3><div id="log" role="log" aria-live="polite"></div>
  </section>
  <script>
    const link = document.querySelector('#demo-link');
    const log = document.querySelector('#log');
    const state = document.querySelector('#state');
    function record(message) { log.textContent += new Date().toLocaleTimeString() + ' ' + message + '\n'; }
    function setBroken(broken) {
      link.setAttribute('href', broken ? '#' : '#destination');
      document.querySelector('#link-state').textContent = broken ? 'broken' : 'working';
      state.textContent = broken ? 'Before: the link is broken.' : 'Before: the link works.';
      history.replaceState(null, '', location.pathname);
      record(broken ? 'Broken navigation activated.' : 'Working navigation restored.');
    }
    document.querySelector('#activate').addEventListener('click', () => setBroken(true));
    document.querySelector('#reset').addEventListener('click', () => setBroken(false));
    link.addEventListener('click', () => record('Navigation link clicked.'));
    window.addEventListener('hashchange', () => {
      if (location.hash === '#destination') { state.textContent = 'After: destination reached.'; record('Destination reached.'); }
    });
    record('Broken navigation active.');
  </script>
</body>
</html>
